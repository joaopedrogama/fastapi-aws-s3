name: indigo-s3

services:
  api:
    build: .
    working_dir: /app
    container_name: api-s3
    command: uv run uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    env_file:
      - .env
    develop:
      watch:
        - action: sync+restart
          path: ./app
          target: /app/app
        - action: rebuild
          path: ./pyproject.toml

  minio:
    image: coollabsio/minio:latest
    ports:
      - ${S3_EXTERNAL_PORT}:${S3_INTERNAL_PORT}
      - ${MINIO_CONSOLE_EXTERNAL_PORT}:${MINIO_CONSOLE_INTERNAL_PORT}
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY}
      MINIO_BROWSER: "on"
      MINIO_SERVER_URL: "http://localhost:${S3_INTERNAL_PORT}"
      MINIO_BROWSER_REDIRECT_URL: "http://localhost:${MINIO_CONSOLE_INTERNAL_PORT}"
    volumes:
      - minio-data:/data
    command: minio server /data --console-address ':${MINIO_CONSOLE_INTERNAL_PORT}'
    restart: unless-stopped
    env_file:
      - .env

volumes:
 minio-data:
